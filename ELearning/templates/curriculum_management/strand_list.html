{% extends "base.html" %}

{% block title %} {{ subject.name }} {% endblock %}

{% block content %}
<div id="app" class="container py-4">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold mb-0">
            <div class="card">
                <div class="card-body">
                    <h3>Strands for {{ subject.name }}, {{ subject.grade }}</h3>
                </div>
            </div>

        </h3>
        <button class="btn btn-warning"
                @click="showModal = true">
            + Add Strand
        </button>
    </div>

    <!-- Grid -->
    <div class="row g-3">

        <div class="col-md-4"
             v-for="strand in strands"
             :key="strand.id">

            <div class="card h-100 shadow-sm border-0">
                <div class="card-body d-flex flex-column">

                    <!-- Title -->
                    <div class="d-flex justify-content-between align-items-start">
                        <h5 class="fw-semibold">
                            [[ strand.name ]]
                        </h5>

                        <div class="btn-group btn-group-sm">
                            <button class="btn btn-outline-danger"
                                    @click="deleteStrand(strand.id)">
                                Delete
                            </button>
                        </div>
                    </div>

                    <!-- Bottom Button -->
                    <div class="mt-auto pt-3">
                        <a :href="`/substrands/${strand.id}/`"
                           class="btn btn-outline-warning btn-sm w-100">
                           View Sub-Strands
                        </a>
                    </div>

                </div>
            </div>

        </div>

    </div>

    <!-- Empty State -->
    <div v-if="strands.length === 0" class="text-center text-muted mt-5">
       <div class="card">
           <div class="card-body">
               <h4>No strands created yet.</h4>
           </div>
       </div>
    </div>

    <!-- Modal -->
    <div v-if="showModal"
         class="modal fade show d-block"
         style="background: rgba(0,0,0,0.5);">

        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Add Strand</h5>
                    <button type="button"
                            class="btn-close"
                            @click="closeModal"></button>
                </div>

                <div class="modal-body">
                    <input type="text"
                           v-model="newStrand"
                           class="form-control"
                           placeholder="Enter strand name">
                </div>

                <div class="modal-footer">
                    <button class="btn btn-secondary"
                            @click="closeModal">
                        Cancel
                    </button>
                    <button class="btn btn-primary"
                            @click="addStrand">
                        Save
                    </button>
                </div>

            </div>
        </div>
    </div>

    <!-- Toast -->
    <div v-if="successMessage"
         class="alert alert-success position-fixed bottom-0 end-0 m-4 shadow"
         style="z-index:1055;">
        [[ successMessage ]]
    </div>

</div>

<!-- Vue + Axios -->
<script>
document.addEventListener("DOMContentLoaded", function () {

    const { createApp } = Vue;

    createApp({
        delimiters: ['[[', ']]'],

        data() {
            return {
                strands: {{ strands_json|safe }},
                subjectId: {{ subject.id }},
                csrfToken: '{{ csrf_token }}',
                showModal: false,
                newStrand: '',
                successMessage: ''
            }
        },

        methods: {

            closeModal() {
                this.showModal = false;
                this.newStrand = '';
            },

            async addStrand() {
                if (!this.newStrand.trim()) {
                    alert("Strand name is required.");
                    return;
                }

                try {
                    axios.defaults.headers.common['X-CSRFToken'] = this.csrfToken;

                    const response = await axios.post(
                        `/api/subjects/${this.subjectId}/add-strand/`,
                        { name: this.newStrand }
                    );

                    this.strands.push(response.data);
                    this.closeModal();
                    this.showToast("Strand added successfully.");

                } catch (error) {
                    console.error(error);
                    alert("Failed to add strand.");
                }
            },

            async deleteStrand(id) {
                if (!confirm("Are you sure you want to delete this strand?"))
                    return;

                try {
                    axios.defaults.headers.common['X-CSRFToken'] = this.csrfToken;

                    await axios.delete(
                        `/delete/strand/${this.subjectId}/${id}/`
                    );

                    this.strands = this.strands.filter(s => s.id !== id);
                    this.showToast("Strand deleted successfully.");

                } catch (error) {
                    console.error(error);
                    alert("Failed to delete strand.");
                }
            },

            showToast(message) {
                this.successMessage = message;
                setTimeout(() => this.successMessage = '', 3000);
            }

        }

    }).mount('#app');

});
</script>

{% endblock %}
