{% extends 'base.html' %}

{% block content %}
<!-- templates/videos/video_list.html -->
<h2>Video Resources</h2>

{% for video in videos %}
    <div style="margin-bottom:20px;">
        <h3>{{ video.title }}</h3>
        <p>{{ video.description }}</p>

        <video width="500" controls>
            <source src="{{ video.video.url }}" type="video/mp4">
        </video>
    </div>
{% endfor %}
{% endblock %}
