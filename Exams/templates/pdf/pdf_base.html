{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}{% endblock %}</title>
    <style>
    @page { size: A4; margin: 1.2cm; }

    body {
      font-family: "Century Gothic", sans-serif;
      font-size: 14px;
      color: #111;
    }

    /* ===== HEADER SECTION ===== */
    .header {
      display: flex;
      align-items: center;
      border-bottom: 2px solid #333;
      padding-bottom: 6px;
      margin-bottom: 10px;
      gap: 18px;
    }

    .logo {
      width: 85px;
      height: 85px;
      object-fit: contain;
    }

    .school-info {
      flex: 1;
      text-align: left;
    }

    .school-info h1 {
      font-size: 22px;
      font-weight: 700;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #000;
    }

    .school-info p {
      margin: 2px 0;
      font-size: 12px;
      color: #333;
    }

    /* ===== TITLES ===== */
    h2 {
      text-align: center;
      font-size: 15px;
      font-weight: bold;
      margin: 10px 0 14px 0;
      color: #000;
    }

    h1.student-name {
      text-align: center;
      background-color: #f3f3f3;
      border: 1px solid #bbb;
      padding: 10px;
      font-size: 16px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 5px;
    }

    h2.grade-name {
      text-align: center;
      font-size: 15px;
      margin-top: 0;
      color: #555;
    }

    /* ===== TABLE STYLES ===== */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      margin-bottom: 20px;
      font-size: 14px;       /* Increased from 13px */
      min-height: 60cm;      /* WeasyPrint understands cm, not vh */
    }


    th, td {
      border: 1px solid #444;
      padding: 8px 6px;
      text-align: center;
      vertical-align: middle;
      font-size: 14px;
    }

    th {
      background-color: #eaeaea;
      font-weight: 600;
      word-wrap: break-word;
      white-space: normal;
      max-width: 130px;
      font-size: 12px;
    }

    td {
      background-color: #fff;
      font-size: 12.5px;
    }

    tr:nth-child(even) td {
      background-color: #fafafa;
    }

    tr:hover td {
      background-color: #f2f2f2;
    }

    /* ===== COMMENTS SECTION ===== */
    .comment-box {
      border: 1px solid #555;
      padding: 10px 12px;
      margin-top: 15px;
      font-size: 13px;
      background-color: #f9f9f9;
      line-height: 2.5;
    }

    .comment-box p {
      margin: 5px 0;
    }

    /* ===== FOOTER INFO ===== */
    .footer-info {
      margin-top: 10px;
      text-align: center;
      font-size: 11px;
      color: #555;
    }

    /* ===== PAGE BREAK BETWEEN STUDENTS ===== */
    .page-break {
      page-break-after: always;
    }
  </style>
</head>

<body>
  <div class="header">
    <img src="{% static 'media/school_logo.png' %}" class="logo">
    <div class="school-info">
      <h1>UNITED MATUNDA ACADEMY</h1>
      <p>Faith + Effort makes a mighty pair</p>
      <p>P.O Box 311, Moi’s Bridge</p>
    </div>
  </div>
{% block content %}


{% endblock %}
</body>

</html>
