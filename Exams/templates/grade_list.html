{% extends 'base.html' %}
{% block title %}Grades {% endblock %}
{% block content %}

<div class="container my-4">
    <div class="card">
        <div class="card-body">
            <h2 class="mb-4 text-center fw-bold">📚 Grades Overview</h2>
        </div>
    </div>
    <br>
  <div class="row g-4">
    {% for grade in grades_list %}
      <div class="col-md-4 col-sm-6">
        <div class="card shadow-sm border-0 h-100 grade-card glass-card">
          <div class="card-body d-flex flex-column justify-content-between">

            <!-- Grade Name + Exam Count -->
            <div class="text-center mb-3">
              <h4 class="fw-bold text-primary">{{ grade }}</h4>
              <span class="badge bg-info text-dark">
                {{ grade.grade_exam.count }} Exams
              </span>
              <p class="text-muted small mt-2 mb-0">Manage exams & performances</p>
            </div>

            <!-- View Button -->
            <div class="d-flex justify-content-center">
              <a href="{% url 'exam_list' grade.pk %}" class="btn btn-outline-primary px-4">
                View Exams →
              </a>
            </div>

          </div>
        </div>
      </div>
    {% empty %}
      <div class="col-12">
        <div class="alert alert-info text-center shadow-sm">
          <h5 class="mb-0">⚠️ No Grade list updated yet</h5>
        </div>
      </div>
    {% endfor %}
  </div>
</div>

<style>
  .grade-card {
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    border-radius: 12px;
  }
  .grade-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.12);
  }
    .glass-card {
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.2);
    color: white;
}
</style>
{% endblock %}
