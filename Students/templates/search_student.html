{% extends 'base.html' %}
{% block title %} Find Student {% endblock %}

{% block nav %}
<a href="{% url 'student_register' %}" class="btn btn-info btn-lg">➕ Register</a>
{% endblock %}

{% block content %}
<div id="app" class="container py-2">
  <!-- Page Title -->
  <div class="text-center mb-4">
    <h2 class="fw-bold text-primary">Find Your Name</h2>
    <p class="lead text-muted">Select your grade first, then choose your name to begin.</p>
  </div>

  <!-- Card Wrapper -->
  <div class="card shadow-lg border-0 rounded-3 p-4">
    <div class="card-body">

      <!-- Grade dropdown -->
      <div class="mb-4">
        <label for="gradeSelect" class="form-label fw-bold fs-5">📘 Select Your Grade:</label>
        <select id="gradeSelect"
                v-model="selectedGrade"
                @change="fetchStudents"
                class="form-select form-select-lg">
          <option value="">-- Choose Grade --</option>
          <option v-for="grade in grades" :key="grade.id" :value="grade.id">
            [[ grade.name ]]
          </option>
        </select>
      </div>

      <!-- Student dropdown -->
      <div class="mb-4" v-if="selectedGrade">
        <label for="studentSelect" class="form-label fw-bold fs-5">👩‍🎓 Select Your Name:</label>
        <select id="studentSelect"
                v-model="selectedStudent"
                class="form-select form-select-lg">
          <option value="">-- Click on your Name --</option>
          <option v-for="student in students" :key="student.id" :value="student.id">
            [[ student.first_name ]] [[ student.second_name ]]
          </option>
        </select>
      </div>

      <!-- Action button -->
      <div class="text-center">
        <button class="btn btn-success btn-lg px-5"
                :disabled="!selectedStudent"
                @click="goToAssessment">
          🚀 Take Assessment
        </button>
      </div>

    </div>
  </div>
</div>

<!-- Vue 3 + Axios -->
<script>
const { createApp } = Vue;

createApp({
  delimiters: ['[[', ']]'],
  data() {
    return {
      grades: {{ grades_json|safe }},
      assessmentId: {{ assessment_id }},
      selectedGrade: "",
      students: [],
      selectedStudent: ""
    }
  },
  methods: {
    async fetchStudents() {
      this.students = [];
      this.selectedStudent = "";
      if (this.selectedGrade) {
        try {
          const response = await axios.get(`/students/students/by-grade/${this.selectedGrade}/`);
          this.students = response.data;
        } catch (error) {
          console.error("Error fetching students:", error);
        }
      }
    },
    goToAssessment() {
      if (this.selectedStudent) {
        window.location.href = `/assessment/take/${this.assessmentId}/${this.selectedStudent}/`;
      }
    }
  }
}).mount("#app");
</script>

<style>
  .form-select-lg {
    padding: 0.75rem 1rem;
    font-size: 1.2rem;
  }
  .btn-lg {
    font-size: 1.2rem;
    padding: 0.8rem 1.5rem;
  }
</style>
{% endblock %}
