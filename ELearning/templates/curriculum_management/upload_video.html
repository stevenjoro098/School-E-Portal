{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block content %}
<!-- templates/videos/upload_video.html -->


<div class="card">
    <div class="card-header">
        <h2>Upload Video</h2>
    </div>
    <div class="card-body">
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form|crispy}}

            <button type="submit">Upload</button>
        </form>
    </div>
</div>

{% endblock %}
