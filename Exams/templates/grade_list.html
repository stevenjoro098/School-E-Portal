{% extends 'base.html' %}

{% block content %}
<div class="container my-4">
  <h2 class="mb-4 text-center fw-bold">📚 Grades Overview</h2>
  <hr>
  <div class="row g-4">
    {% for grade in grades_list %}
      <div class="col-md-4 col-sm-6">
        <div class="card shadow-sm border-0 h-100 grade-card">
          <div class="card-body d-flex flex-column justify-content-between">
            <div class="text-center mb-3">
              <h4 class="fw-bold text-primary">{{ grade }}</h4>
              <p class="text-muted small mb-0">Manage exams & performances</p>
            </div>
            <div class="d-flex justify-content-center">
              <a href="{% url 'exam_list' grade.pk %}" class="btn btn-outline-primary px-4">
                View Exams →
              </a>
            </div>
          </div>
        </div>
      </div>
    {% empty %}
      <div class="col-12">
        <div class="alert alert-info text-center shadow-sm">
          <h5 class="mb-0">⚠️ No Grade list updated yet</h5>
        </div>
      </div>
    {% endfor %}
  </div>
</div>

<style>
  .grade-card {
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    border-radius: 12px;
  }
  .grade-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.12);
  }
</style>
{% endblock %}
