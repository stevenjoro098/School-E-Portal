{% extends 'base.html' %}
{% load static %}

{% block title %} Strands {% endblock %}

{% block content %}
<div class="container py-2">

  <!-- Page Header -->
  <div class="mb-4">
    <h3 class="fw-bold mb-1">{{ subject }}</h3>
  </div>
  <hr>

  <!-- Strands Grid -->
  <div class="row g-4">

    {% for item in strands_list %}
    <div class="col-12 col-sm-6 col-lg-4">

      <div class="card h-100 shadow-sm border-0 strand-card">

        <!-- Image -->
        <div class="text-center p-3">
          <img src="{% static 'images/strands.jpg' %}"
               class="img-fluid rounded"
               style="max-height: 120px;"
               alt="Strand Image">
        </div>

        <!-- Card Body -->
        <div class="card-body d-flex flex-column">

          <h5 class="fw-semibold mb-3">{{ item }}</h5>

          <div class="mt-auto">
            <a href="{% url 'substrands_list' item.pk %}"
               class="btn btn-info btn-sm w-100">
              View Substrands
            </a>
          </div>

        </div>
      </div>

    </div>
    {% empty %}
    <div class="col-12">
      <div class="alert alert-info text-center">
        No strands available for this subject.
      </div>
    </div>
    {% endfor %}

  </div>
</div>

<!-- Optional UI polish -->
<style>
.strand-card {
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.strand-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 6px 18px rgba(0,0,0,0.08);
}

.card h5 {
  font-size: 1.1rem;
  text-align: center;
}

@media (max-width: 768px) {
  .card img {
    max-height: 100px;
  }
}
</style>

{% endblock %}
