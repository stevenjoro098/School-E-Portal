{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %} Create Notice {% endblock %}
{% block content %}
    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}
                <button class="btn btn-primary" type="submit">
                    Post
                </button>
            </form>
        </div>
    </div>

{% endblock %}
